name: dependency health

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dependency-health:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency graph
        run: npm run deps:check
